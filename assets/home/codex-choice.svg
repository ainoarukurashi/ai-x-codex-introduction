<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 252" role="img" aria-labelledby="title desc">
  <title id="title">Codex</title>
  <desc id="desc">淡い青紫の背景にCodexのアイコンと名前を配置した選択カード用画像。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="0.5" stop-color="#f5f0ff"/>
      <stop offset="1" stop-color="#d5e0ff"/>
    </linearGradient>
    <radialGradient id="soft-blue" cx="0.08" cy="0.78" r="0.6">
      <stop offset="0" stop-color="#c8e8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c8e8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soft-violet" cx="0.83" cy="0.38" r="0.52">
      <stop offset="0" stop-color="#7c78ff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#7c78ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8b8ff"/>
      <stop offset="0.5" stop-color="#796cff"/>
      <stop offset="1" stop-color="#3777ff"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4f63c8" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="560" height="252" fill="url(#bg)"/>
  <rect width="560" height="252" fill="url(#soft-blue)"/>
  <rect width="560" height="252" fill="url(#soft-violet)"/>
  <ellipse cx="150" cy="220" rx="220" ry="58" fill="#ffffff" opacity="0.28" filter="url(#blur)"/>
  <g transform="translate(236 42)" filter="url(#shadow)">
    <rect width="88" height="88" rx="24" fill="#fff" opacity="0.94"/>
    <g transform="translate(17 19)">
      <circle cx="25" cy="19" r="19" fill="url(#icon)"/>
      <circle cx="41" cy="22" r="18" fill="url(#icon)"/>
      <circle cx="20" cy="39" r="18" fill="url(#icon)"/>
      <circle cx="39" cy="42" r="19" fill="url(#icon)"/>
      <path d="M20 27l8 8-8 8" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M37 43h14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
  <text x="280" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="500" fill="#05070d">Codex</text>
</svg>
