<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="752" viewBox="0 0 1200 752" role="img" aria-labelledby="title desc">
  <title id="title">Codex WindowsでGitが見つからない場合の想定エラー画面</title>
  <desc id="desc">CodexのWindows画面上にGitが見つからないエラーが表示されている想定スクリーンショット</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#111827" flood-opacity=".14"/>
    </filter>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="752" fill="url(#bg)"/>
  <rect x="52" y="42" width="1096" height="668" rx="18" fill="#ffffff" stroke="#d6dee9" filter="url(#shadow)"/>

  <rect x="52" y="42" width="1096" height="42" rx="18" fill="#fbfcfe"/>
  <rect x="52" y="70" width="1096" height="14" fill="#fbfcfe"/>
  <circle cx="76" cy="63" r="6" fill="#ff5f57"/>
  <circle cx="96" cy="63" r="6" fill="#febc2e"/>
  <circle cx="116" cy="63" r="6" fill="#28c840"/>
  <text x="590" y="68" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#6b7280">Codex</text>

  <rect x="52" y="84" width="246" height="626" fill="#f7f9fc"/>
  <rect x="80" y="116" width="154" height="30" rx="8" fill="#e8eef7"/>
  <text x="102" y="136" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="#334155">AI-X</text>
  <rect x="80" y="170" width="174" height="12" rx="6" fill="#d7dfeb"/>
  <rect x="80" y="200" width="126" height="12" rx="6" fill="#e1e7f0"/>
  <rect x="80" y="230" width="152" height="12" rx="6" fill="#e1e7f0"/>
  <rect x="80" y="260" width="108" height="12" rx="6" fill="#e1e7f0"/>

  <text x="724" y="166" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="28" font-weight="800" fill="#111827">AI-Xでは何に取り組みますか？</text>
  <rect x="456" y="205" width="536" height="78" rx="14" fill="#ffffff" stroke="#d7dee8"/>
  <text x="482" y="238" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#334155">このフォルダについて説明してください。</text>
  <rect x="482" y="254" width="172" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="902" y="232" width="38" height="30" rx="15" fill="#111827"/>
  <text x="921" y="252" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="15" font-weight="900" fill="#ffffff">↑</text>

  <rect x="378" y="340" width="692" height="190" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <rect x="404" y="366" width="52" height="52" rx="12" fill="#ffedd5"/>
  <text x="430" y="400" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="28" font-weight="900" fill="#ea580c">!</text>
  <text x="478" y="383" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="20" font-weight="800" fill="#7c2d12">Gitが見つかりません</text>
  <text x="478" y="418" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#7c2d12">git : The term 'git' is not recognized as the name of a cmdlet,</text>
  <text x="478" y="443" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#7c2d12">function, script file, or operable program.</text>
  <text x="478" y="468" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#7c2d12">Check the spelling of the name, or if a path was included,</text>
  <text x="478" y="493" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#7c2d12">verify that the path is correct and try again.</text>
  <text x="478" y="520" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="15" font-weight="700" fill="#991b1b">Git for Windowsを入れて、Finish後にWindowsを一度再起動してください。</text>

  <rect x="456" y="585" width="536" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="482" y="614" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#64748b">エラーが出ない方は、そのままAI-Xフォルダの動作確認へ進みます。</text>
</svg>
