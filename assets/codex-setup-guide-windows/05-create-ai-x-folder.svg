<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">WindowsのエクスプローラーでAI-Xフォルダを作る画面</title>
  <desc id="desc">Windowsのエクスプローラーでデスクトップを開き、AI-Xという練習用フォルダを作成した状態の操作イメージです。</desc>
  <rect width="1200" height="760" fill="#f4f7fb"/>
  <rect x="54" y="54" width="1092" height="652" rx="18" fill="#ffffff" stroke="#d6dee9" stroke-width="2"/>
  <rect x="54" y="54" width="1092" height="64" rx="18" fill="#f8fafc"/>
  <text x="92" y="94" fill="#172033" font-family="Segoe UI, Yu Gothic, sans-serif" font-size="21" font-weight="700">エクスプローラー</text>
  <rect x="862" y="70" width="218" height="34" rx="17" fill="#eef4ff" stroke="#bfdbfe"/>
  <text x="971" y="93" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, Yu Gothic, sans-serif" font-size="16" font-weight="700">フォルダー作成画面</text>

  <rect x="84" y="142" width="232" height="530" fill="#f1f5f9"/>
  <rect x="106" y="210" width="184" height="42" rx="10" fill="#dbeafe"/>
  <text x="134" y="237" fill="#1d4ed8" font-family="Segoe UI, Yu Gothic, sans-serif" font-size="18" font-weight="700">デスクトップ</text>
  <text x="134" y="180" fill="#64748b" font-family="Segoe UI, Yu Gothic, sans-serif" font-size="18" font-weight="700">ホーム</text>
  <text x="134" y="294" fill="#475569" font-family="Segoe UI, Yu Gothic, sans-serif" font-size="18">ダウンロード</text>
  <text x="134" y="346" fill="#475569" font-family="Segoe UI, Yu Gothic, sans-serif" font-size="18">ドキュメント</text>

  <rect x="350" y="142" width="742" height="54" rx="12" fill="#f8fafc" stroke="#dbe2ec"/>
  <text x="380" y="176" fill="#172033" font-family="Segoe UI, Yu Gothic, sans-serif" font-size="20" font-weight="700">デスクトップ &gt; AI-X</text>
  <rect x="350" y="220" width="742" height="408" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <g transform="translate(448 306)">
    <path d="M0 48C0 36 10 26 22 26h82c9 0 16 5 22 13h150c12 0 22 10 22 22v168c0 12-10 22-22 22H22c-12 0-22-10-22-22V48z" fill="#ffd15c"/>
    <path d="M0 72h298v157c0 12-10 22-22 22H22c-12 0-22-10-22-22V72z" fill="#f2bd3a"/>
    <path d="M24 42h90c7 0 12 3 16 8l12 14H24c-8 0-14 6-14 14V56c0-8 6-14 14-14z" fill="#ffe08a"/>
  </g>
  <rect x="488" y="596" width="220" height="48" rx="12" fill="#172033"/>
  <text x="598" y="628" text-anchor="middle" fill="#fff" font-family="Segoe UI, Yu Gothic, sans-serif" font-size="26" font-weight="800">AI-X</text>

  <g transform="translate(764 292)">
    <rect width="252" height="170" rx="14" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="24" y="40" fill="#172033" font-family="Segoe UI, Yu Gothic, sans-serif" font-size="17" font-weight="700">右クリックメニュー</text>
    <rect x="16" y="62" width="220" height="36" rx="8" fill="#eef4ff"/>
    <text x="30" y="86" fill="#1d4ed8" font-family="Segoe UI, Yu Gothic, sans-serif" font-size="16" font-weight="700">新規作成</text>
    <text x="30" y="126" fill="#334155" font-family="Segoe UI, Yu Gothic, sans-serif" font-size="16">フォルダー</text>
  </g>

  <text x="350" y="670" fill="#64748b" font-family="Segoe UI, Yu Gothic, sans-serif" font-size="18">デスクトップに AI-X フォルダができたら、次にCodexでこのフォルダを選びます。</text>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172033" flood-opacity=".16"/>
    </filter>
  </defs>
</svg>
