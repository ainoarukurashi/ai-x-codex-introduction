<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude設定 機能</title>
  <desc id="desc">メモリー、ツールアクセス、コード実行とファイル作成を確認する画面の参考図</desc>
  <style>.bg{fill:#f7f7f5}.panel{fill:#fff}.sel{fill:#e8e6e2}.line{stroke:#e4e0da;stroke-width:1}.txt{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#171717}.muted{fill:#777}.small{font-size:14px}.head{font-size:22px;font-weight:800}.toggle{fill:#2563eb}.box{fill:#f0efec}.btn{fill:#fff;stroke:#ddd}</style>
  <rect width="960" height="620" class="bg"/><rect width="960" height="34" class="panel"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="56" cy="17" r="6" fill="#28c840"/><text x="86" y="23" class="txt small">設定</text>
  <rect x="0" y="34" width="182" height="586" class="panel"/><text x="22" y="80" class="txt small">一般</text><text x="22" y="112" class="txt small">アカウント</text><text x="22" y="144" class="txt small">プライバシー</text><text x="22" y="176" class="txt small">請求</text><text x="22" y="208" class="txt small">使用量</text><rect x="12" y="220" width="158" height="30" rx="7" class="sel"/><text x="22" y="240" class="txt small">機能</text><text x="22" y="272" class="txt small">コネクタ</text><text x="22" y="304" class="txt small">Claude Code</text>
  <text x="210" y="78" class="txt head">メモリー</text><text x="210" y="122" class="txt small">チャットを検索・参照</text><text x="210" y="148" class="muted small">過去のチャットから関連する詳細を検索します</text><rect x="900" y="120" width="34" height="18" rx="9" class="toggle"/><circle cx="923" cy="129" r="7" fill="#fff"/>
  <line x1="210" y1="170" x2="930" y2="170" class="line"/><text x="210" y="206" class="txt small">チャット履歴からメモリーを生成</text><text x="210" y="232" class="muted small">関連するコンテキストを記憶しやすくします</text><rect x="900" y="204" width="34" height="18" rx="9" class="toggle"/><circle cx="923" cy="213" r="7" fill="#fff"/>
  <rect x="210" y="262" width="720" height="34" rx="8" class="box"/><text x="224" y="284" class="txt small">メモリの表示と管理</text>
  <text x="210" y="360" class="txt head">コード実行とファイル作成</text><text x="210" y="405" class="txt small">クラウドコード実行とファイル作成</text><text x="210" y="431" class="muted small">ドキュメント、PDF、データレポートの作成・編集に使います</text><rect x="900" y="403" width="34" height="18" rx="9" class="toggle"/><circle cx="923" cy="412" r="7" fill="#fff"/>
  <line x1="210" y1="456" x2="930" y2="456" class="line"/><text x="210" y="492" class="txt small">ネットワーク外部通信を許可</text><text x="210" y="518" class="muted small">パッケージやライブラリを使う高度な作業で必要になる場合があります</text><rect x="900" y="490" width="34" height="18" rx="9" class="toggle"/><circle cx="923" cy="499" r="7" fill="#fff"/>
  <rect x="245" y="548" width="630" height="42" rx="10" fill="#fff" stroke="#ddd"/><text x="265" y="574" class="txt small">Claudeはインターネット上の許可された範囲にアクセスできます</text>
</svg>
