<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude in Chrome設定</title>
  <desc id="desc">サイト権限とブロックされたサイトを確認する画面の参考図</desc>
  <style>.bg{fill:#f7f7f5}.panel{fill:#fff}.sel{fill:#e8e6e2}.line{stroke:#e4e0da;stroke-width:1}.txt{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#171717}.muted{fill:#777}.small{font-size:14px}.head{font-size:22px;font-weight:800}.btn{fill:#fff;stroke:#ddd}</style>
  <rect width="960" height="620" class="bg"/><rect width="960" height="34" class="panel"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="56" cy="17" r="6" fill="#28c840"/><text x="86" y="23" class="txt small">設定</text>
  <rect x="0" y="34" width="182" height="586" class="panel"/><text x="22" y="80" class="txt small">一般</text><text x="22" y="112" class="txt small">アカウント</text><text x="22" y="144" class="txt small">プライバシー</text><text x="22" y="176" class="txt small">請求</text><text x="22" y="208" class="txt small">使用量</text><text x="22" y="240" class="txt small">機能</text><text x="22" y="272" class="txt small">コネクタ</text><text x="22" y="304" class="txt small">Claude Code</text><text x="22" y="336" class="txt small">Cowork</text><rect x="12" y="348" width="158" height="30" rx="7" class="sel"/><text x="22" y="368" class="txt small">Claude in Chrome</text>
  <rect x="220" y="70" width="46" height="46" rx="8" fill="#fff" stroke="#222"/><rect x="228" y="80" width="30" height="22" fill="#f2efe9" stroke="#222"/><path d="M246 103l20 13-10 3 8 12-8 5-8-13-8 8z" fill="#fff" stroke="#222"/>
  <text x="210" y="160" class="txt head">Claude in Chrome の設定</text>
  <text x="210" y="230" class="txt head">サイトの権限</text><text x="210" y="280" class="txt small">すべてのサイトでデフォルト</text><text x="210" y="306" class="muted small">Claudeをすべてのサイトで動作させるか選択します</text><rect x="810" y="258" width="120" height="32" rx="8" class="btn"/><text x="830" y="279" class="txt small">拡張機能を許可</text>
  <rect x="210" y="338" width="720" height="44" rx="10" fill="#fff" stroke="#ddd"/><text x="240" y="366" class="txt small">Claude in Chromeは、ブロックしたサイトを除くすべてのサイトで動作します</text>
  <text x="210" y="450" class="txt head">ブロックされたサイト</text><text x="210" y="482" class="muted small">これらのサイトではClaude in Chromeを利用できません</text><rect x="790" y="435" width="140" height="34" rx="8" fill="#111827"/><text x="820" y="458" fill="#fff" class="small" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif">サイトを追加</text>
  <line x1="210" y1="518" x2="930" y2="518" class="line"/><text x="500" y="570" class="muted small">サイトはまだ追加されていません</text>
</svg>
