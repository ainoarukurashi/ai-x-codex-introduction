<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Claudeデスクトップアプリ ブラウザ使用とコンピュータ使用</title>
  <desc id="desc">ブラウザ使用、接続中のブラウザ、コンピュータ使用、アクセシビリティ、画面録画を確認する画面の参考図</desc>
  <style>.bg{fill:#f7f7f5}.panel{fill:#fff}.sel{fill:#e8e6e2}.line{stroke:#e4e0da;stroke-width:1}.txt{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#171717}.muted{fill:#777}.small{font-size:14px}.head{font-size:22px;font-weight:800}.toggle{fill:#2563eb}.btn{fill:#fff;stroke:#ddd}.box{fill:#fff;stroke:#ddd}.pill{fill:#ece9e3}</style>
  <rect width="960" height="620" class="bg"/><rect width="960" height="34" class="panel"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="56" cy="17" r="6" fill="#28c840"/><text x="86" y="23" class="txt small">設定</text>
  <rect x="0" y="34" width="182" height="586" class="panel"/><text x="22" y="80" class="txt small">一般</text><text x="22" y="112" class="txt small">アカウント</text><text x="22" y="144" class="txt small">プライバシー</text><text x="22" y="176" class="txt small">請求</text><text x="22" y="208" class="txt small">使用量</text><text x="22" y="240" class="txt small">機能</text><text x="22" y="272" class="txt small">コネクタ</text><text x="22" y="304" class="txt small">Claude Code</text><text x="22" y="392" class="muted small">デスクトップアプリ</text><rect x="12" y="405" width="158" height="30" rx="7" class="sel"/><text x="22" y="425" class="txt small">一般</text><text x="22" y="458" class="txt small">拡張機能</text><text x="22" y="491" class="txt small">開発者</text>
  <text x="210" y="78" class="txt head">ブラウザ使用</text>
  <text x="210" y="124" class="txt small">すべてのブラウザアクションを許可</text><text x="210" y="150" class="muted small">Claudeが確認なしにChromeで任意のWebサイトを閲覧、操作します</text><rect x="900" y="122" width="34" height="18" rx="9" class="toggle"/><circle cx="923" cy="131" r="7" fill="#fff"/>
  <line x1="210" y1="178" x2="930" y2="178" class="line"/>
  <text x="210" y="214" class="txt small">接続中のブラウザ</text><text x="210" y="240" class="muted small">Claudeが自動操作できる、サインイン済みのChromeです</text>
  <rect x="210" y="260" width="720" height="96" rx="10" class="box"/>
  <text x="235" y="292" class="txt small">1台のブラウザが接続中</text><rect x="820" y="273" width="80" height="28" rx="8" class="btn"/><text x="840" y="292" class="txt small">再確認</text>
  <line x1="210" y1="305" x2="930" y2="305" class="line"/><text x="250" y="326" class="txt small">MacbookPro</text><text x="250" y="346" class="muted small">macOS</text><text x="790" y="326" class="muted small">デバイスID: ****</text>
  <text x="210" y="414" class="txt head">コンピュータ使用</text><rect x="342" y="393" width="52" height="24" rx="12" class="pill"/><text x="356" y="410" class="muted small">ベータ</text>
  <text x="210" y="462" class="txt small">許可したアプリでClaudeがスクリーンショットを撮影し、キーボードとマウスを操作できます</text><rect x="900" y="458" width="34" height="18" rx="9" class="toggle"/><circle cx="923" cy="467" r="7" fill="#fff"/>
  <line x1="210" y1="494" x2="930" y2="494" class="line"/>
  <text x="210" y="530" class="txt small">アクセシビリティ</text><rect x="830" y="510" width="100" height="30" rx="8" class="pill"/><text x="852" y="530" class="muted small">許可済み</text>
  <line x1="210" y1="554" x2="930" y2="554" class="line"/>
  <text x="210" y="590" class="txt small">画面録画</text><rect x="710" y="570" width="100" height="30" rx="8" class="pill"/><text x="731" y="590" class="muted small">リクエストなし</text><rect x="826" y="570" width="104" height="30" rx="8" class="btn"/><text x="846" y="590" class="txt small">システム設定</text>
</svg>
