<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Claudeデスクトップアプリ 一般的なデスクトップ設定</title>
  <desc id="desc">起動、クイックアクセス、音声ショートカット、メニューバー、スリープさせない設定を確認する画面の参考図</desc>
  <style>.bg{fill:#f7f7f5}.panel{fill:#fff}.sel{fill:#e8e6e2}.line{stroke:#e4e0da;stroke-width:1}.txt{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#171717}.muted{fill:#777}.small{font-size:14px}.head{font-size:22px;font-weight:800}.toggle{fill:#2563eb}.btn{fill:#fff;stroke:#ddd}</style>
  <rect width="960" height="620" class="bg"/><rect width="960" height="34" class="panel"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="56" cy="17" r="6" fill="#28c840"/><text x="86" y="23" class="txt small">設定</text>
  <rect x="0" y="34" width="182" height="586" class="panel"/><text x="22" y="80" class="txt small">一般</text><text x="22" y="112" class="txt small">アカウント</text><text x="22" y="144" class="txt small">プライバシー</text><text x="22" y="176" class="txt small">請求</text><text x="22" y="208" class="txt small">使用量</text><text x="22" y="240" class="txt small">機能</text><text x="22" y="272" class="txt small">コネクタ</text><text x="22" y="304" class="txt small">Claude Code</text><text x="22" y="392" class="muted small">デスクトップアプリ</text><rect x="12" y="405" width="158" height="30" rx="7" class="sel"/><text x="22" y="425" class="txt small">一般</text><text x="22" y="458" class="txt small">拡張機能</text><text x="22" y="491" class="txt small">開発者</text>
  <text x="210" y="80" class="txt head">一般的なデスクトップ設定</text>
  <text x="210" y="130" class="txt small">スタートアップ時に実行</text><text x="210" y="156" class="muted small">ログイン時にClaudeを自動起動します</text><rect x="900" y="128" width="34" height="18" rx="9" class="toggle"/><circle cx="923" cy="137" r="7" fill="#fff"/>
  <line x1="210" y1="178" x2="930" y2="178" class="line"/><text x="210" y="214" class="txt small">クイックアクセスショートカット</text><text x="210" y="240" class="muted small">デスクトップのどこからでもClaudeにメッセージを送信します</text><rect x="760" y="198" width="170" height="32" rx="8" class="btn"/><text x="785" y="219" class="txt small">Optionを2回タップ</text>
  <line x1="210" y1="266" x2="930" y2="266" class="line"/><text x="210" y="302" class="txt small">音声ショートカット</text><text x="210" y="328" class="muted small">デスクトップのどこからでもClaudeに音声で話しかけます</text><rect x="760" y="286" width="170" height="32" rx="8" class="btn"/><text x="790" y="307" class="txt small">ショートカットなし</text>
  <line x1="210" y1="354" x2="930" y2="354" class="line"/><text x="210" y="390" class="txt small">メニューバー</text><text x="210" y="416" class="muted small">メニューバーにClaudeを表示します</text><rect x="900" y="388" width="34" height="18" rx="9" class="toggle"/><circle cx="923" cy="397" r="7" fill="#fff"/>
  <line x1="210" y1="442" x2="930" y2="442" class="line"/><text x="210" y="478" class="txt small">コンピュータをスリープさせない</text><text x="210" y="504" class="muted small">Claudeを開いている間、タスクを続けられるようにします</text><rect x="900" y="476" width="34" height="18" rx="9" class="toggle"/><circle cx="923" cy="485" r="7" fill="#fff"/>
</svg>
