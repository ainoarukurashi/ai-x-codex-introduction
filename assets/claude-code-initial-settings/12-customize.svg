<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude Customize コネクタとスキル</title>
  <desc id="desc">Customize画面でコネクタとスキルを確認する参考図</desc>
  <style>.bg{fill:#f7f7f5}.panel{fill:#fff}.sel{fill:#e8e6e2}.line{stroke:#e4e0da;stroke-width:1}.txt{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#171717}.muted{fill:#777}.small{font-size:14px}.head{font-size:22px;font-weight:800}.btn{fill:#fff;stroke:#ddd}.blue{fill:#2563eb}</style>
  <rect width="960" height="620" class="bg"/><rect width="960" height="34" class="panel"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="56" cy="17" r="6" fill="#28c840"/><text x="86" y="23" class="txt small">Customize</text>
  <rect x="0" y="34" width="190" height="586" class="panel"/><rect x="10" y="58" width="170" height="32" rx="7" class="btn"/><text x="28" y="79" class="txt small">Desktop</text><text x="22" y="130" class="txt small">スキル</text><rect x="12" y="145" width="166" height="30" rx="7" class="sel"/><text x="22" y="165" class="txt small">コネクタ</text><text x="22" y="225" class="muted small">個人用プラグイン</text><rect x="40" y="258" width="128" height="36" rx="8" class="btn"/><text x="62" y="281" class="txt small">プラグインを参照</text>
  <rect x="190" y="34" width="270" height="586" fill="#fafafa" stroke="#ddd"/><text x="210" y="72" class="txt head">コネクタ</text><text x="210" y="112" class="muted small">Web</text><rect x="205" y="132" width="235" height="34" rx="8" class="sel"/><text x="242" y="154" class="txt small">Adobe for creativity</text><text x="242" y="196" class="txt small">Canva</text><text x="242" y="238" class="txt small">GitHub連携</text><text x="242" y="280" class="txt small">Google Drive</text><text x="242" y="322" class="txt small">Notion</text><text x="242" y="364" class="txt small">Slack</text><text x="210" y="430" class="muted small">デスクトップ</text><text x="242" y="472" class="txt small">Claude in Chrome</text>
  <text x="495" y="78" class="txt head">コネクタのツール権限</text><rect x="835" y="58" width="95" height="32" rx="8" class="btn"/><text x="855" y="79" class="txt small">切断する</text>
  <text x="495" y="122" class="muted small">必要な連携だけ接続し、ツールは承認が必要な状態で使います。</text>
  <text x="495" y="185" class="txt small">インタラクティブツール</text><rect x="820" y="164" width="110" height="32" rx="8" class="btn"/><text x="842" y="185" class="txt small">承認が必要</text>
  <line x1="495" y1="220" x2="930" y2="220" class="line"/><text x="515" y="252" class="txt small">asset_search</text><circle cx="872" cy="247" r="13" fill="#eef2ff" stroke="#c7d2fe"/><text x="867" y="252" class="txt small">✓</text><circle cx="910" cy="247" r="13" fill="#fff" stroke="#ddd"/>
  <line x1="495" y1="282" x2="930" y2="282" class="line"/><text x="515" y="314" class="txt small">fill_text</text><circle cx="872" cy="309" r="13" fill="#eef2ff" stroke="#c7d2fe"/><text x="867" y="314" class="txt small">✓</text><circle cx="910" cy="309" r="13" fill="#fff" stroke="#ddd"/>
  <line x1="495" y1="344" x2="930" y2="344" class="line"/><text x="495" y="405" class="txt head">スキル</text><rect x="872" y="384" width="34" height="18" rx="9" class="blue"/><circle cx="895" cy="393" r="7" fill="#fff"/>
  <rect x="495" y="430" width="435" height="150" rx="12" fill="#fff" stroke="#ddd"/><text x="520" y="468" class="txt head">weekly-ai-news-manager</text><text x="520" y="505" class="muted small">個人のスキルは、内容が分かるものだけオンにします。</text><text x="520" y="535" class="muted small">トリガーや説明を確認してから使います。</text>
</svg>
