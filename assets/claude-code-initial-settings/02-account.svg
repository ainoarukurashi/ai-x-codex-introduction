<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude設定 アカウント</title>
  <desc id="desc">ログアウト、組織ID、アクティブなセッションを確認する画面の参考図</desc>
  <style>.bg{fill:#f7f7f5}.panel{fill:#fff}.sel{fill:#e8e6e2}.line{stroke:#e4e0da;stroke-width:1}.txt{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#171717}.muted{fill:#777}.small{font-size:14px}.head{font-size:22px;font-weight:800}.btn{fill:#fff;stroke:#ddd}.tag{fill:#dbeafe}</style>
  <rect width="960" height="620" class="bg"/><rect width="960" height="34" class="panel"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="56" cy="17" r="6" fill="#28c840"/><text x="86" y="23" class="txt small">設定</text>
  <rect x="0" y="34" width="182" height="586" class="panel"/><text x="22" y="80" class="txt small">一般</text><rect x="12" y="92" width="158" height="30" rx="7" class="sel"/><text x="22" y="112" class="txt small">アカウント</text><text x="22" y="144" class="txt small">プライバシー</text><text x="22" y="176" class="txt small">請求</text><text x="22" y="208" class="txt small">使用量</text><text x="22" y="240" class="txt small">機能</text><text x="22" y="272" class="txt small">コネクタ</text><text x="22" y="304" class="txt small">Claude Code</text><text x="22" y="336" class="txt small">Cowork</text><text x="22" y="368" class="txt small">Claude in Chrome</text>
  <text x="210" y="72" class="txt head">アカウント</text>
  <text x="210" y="118" class="txt small">すべてのデバイスからログアウト</text><rect x="850" y="96" width="80" height="30" rx="8" class="btn"/><text x="865" y="116" class="txt small">ログアウト</text>
  <line x1="210" y1="146" x2="930" y2="146" class="line"/><text x="210" y="182" class="txt small">組織ID</text><rect x="790" y="165" width="140" height="22" rx="6" fill="#eee"/><text x="806" y="181" class="muted small">************</text>
  <text x="210" y="250" class="txt head">アクティブなセッション</text>
  <text x="210" y="300" class="muted small">デバイス</text><text x="460" y="300" class="muted small">場所</text><text x="650" y="300" class="muted small">作成済み</text><text x="800" y="300" class="muted small">更新日時</text>
  <line x1="210" y1="312" x2="930" y2="312" class="line"/>
  <text x="210" y="345" class="txt small">Claude Desktop (Mac OS X)</text><rect x="365" y="326" width="44" height="22" rx="6" class="tag"/><text x="376" y="342" class="txt small">現在</text><text x="460" y="345" class="muted small">Tokyo, JP</text><text x="650" y="345" class="muted small">2026年5月</text><text x="800" y="345" class="muted small">たった今</text>
  <line x1="210" y1="365" x2="930" y2="365" class="line"/><text x="210" y="400" class="txt small">Chrome (Mac OS X)</text><text x="460" y="400" class="muted small">Tokyo, JP</text><text x="650" y="400" class="muted small">2026年5月</text><text x="800" y="400" class="muted small">今日</text>
  <line x1="210" y1="420" x2="930" y2="420" class="line"/><text x="210" y="455" class="txt small">Claude Desktop (Windows)</text><text x="460" y="455" class="muted small">Tokyo, JP</text><text x="650" y="455" class="muted small">2026年5月</text><text x="800" y="455" class="muted small">今日</text>
</svg>
