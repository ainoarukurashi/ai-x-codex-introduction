<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 表示設定</title>
  <desc id="desc">コードテーマ、フォント、外観を確認するClaude Code設定画面の参考図</desc>
  <style>.bg{fill:#f7f7f5}.panel{fill:#fff}.sel{fill:#e8e6e2}.line{stroke:#e4e0da;stroke-width:1}.txt{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#171717}.muted{fill:#777}.small{font-size:14px}.head{font-size:22px;font-weight:800}.code{font-family:SFMono-Regular,Consolas,monospace;font-size:14px}</style>
  <rect width="960" height="620" class="bg"/><rect width="960" height="34" class="panel"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="56" cy="17" r="6" fill="#28c840"/><text x="86" y="23" class="txt small">設定</text>
  <rect x="0" y="34" width="182" height="586" class="panel"/><text x="22" y="80" class="txt small">一般</text><text x="22" y="112" class="txt small">アカウント</text><text x="22" y="144" class="txt small">プライバシー</text><text x="22" y="176" class="txt small">請求</text><text x="22" y="208" class="txt small">使用量</text><text x="22" y="240" class="txt small">機能</text><text x="22" y="272" class="txt small">コネクタ</text><rect x="12" y="284" width="158" height="30" rx="7" class="sel"/><text x="22" y="304" class="txt small">Claude Code</text><text x="22" y="336" class="txt small">Cowork</text>
  <text x="210" y="78" class="txt head">Claude Code</text><text x="210" y="122" class="txt head">コードの表示設定</text>
  <rect x="210" y="156" width="340" height="32" rx="8" fill="#fff" stroke="#ddd"/><text x="226" y="177" class="txt small">Claude Light</text><rect x="570" y="156" width="340" height="32" rx="8" fill="#fff" stroke="#ddd"/><text x="586" y="177" class="txt small">Claude Dark</text>
  <rect x="210" y="204" width="340" height="86" rx="8" fill="#fff" stroke="#ddd"/><text x="226" y="232" class="code" fill="#ea580c">function</text><text x="300" y="232" class="code" fill="#2563eb">greet(name: string) {</text><rect x="210" y="242" width="340" height="24" fill="#fde2df"/><text x="226" y="260" class="code" fill="#dc2626">- return "Hello, " + name;</text><rect x="210" y="266" width="340" height="24" fill="#dcfce7"/><text x="226" y="284" class="code" fill="#15803d">+ return `Hello, ${name}`;</text>
  <rect x="570" y="204" width="340" height="86" rx="8" fill="#1f1f1f" stroke="#ddd"/><text x="586" y="232" class="code" fill="#fb923c">function</text><text x="660" y="232" class="code" fill="#c4b5fd">greet(name: string) {</text><rect x="570" y="242" width="340" height="24" fill="#5b2725"/><text x="586" y="260" class="code" fill="#fb7185">- return "Hello, " + name;</text><rect x="570" y="266" width="340" height="24" fill="#173d25"/><text x="586" y="284" class="code" fill="#4ade80">+ return `Hello, ${name}`;</text>
  <line x1="210" y1="320" x2="930" y2="320" class="line"/><text x="210" y="360" class="txt small">コードフォント</text><rect x="760" y="338" width="170" height="32" rx="8" fill="#fff" stroke="#ddd"/><text x="784" y="359" class="muted small">JetBrains Mono</text>
  <text x="210" y="430" class="txt head">外観</text><text x="210" y="480" class="txt small">インターフェースフォント</text><rect x="760" y="458" width="170" height="32" rx="8" fill="#fff" stroke="#ddd"/><text x="792" y="479" class="txt small">システム</text>
  <line x1="210" y1="505" x2="930" y2="505" class="line"/><text x="210" y="545" class="txt small">トランスクリプトのテキストサイズ</text><rect x="805" y="525" width="40" height="28" rx="8" fill="#fff" stroke="#ddd"/><text x="820" y="544" class="txt small">中</text>
</svg>
