<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude設定 請求</title>
  <desc id="desc">契約プラン、支払い方法、請求書を確認する画面の参考図</desc>
  <style>.bg{fill:#f7f7f5}.panel{fill:#fff}.sel{fill:#e8e6e2}.line{stroke:#e4e0da;stroke-width:1}.txt{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#171717}.muted{fill:#777}.small{font-size:14px}.head{font-size:22px;font-weight:800}.btn{fill:#fff;stroke:#ddd}.danger{fill:#dc2626}</style>
  <rect width="960" height="620" class="bg"/><rect width="960" height="34" class="panel"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="56" cy="17" r="6" fill="#28c840"/><text x="86" y="23" class="txt small">設定</text>
  <rect x="0" y="34" width="182" height="586" class="panel"/><text x="22" y="80" class="txt small">一般</text><text x="22" y="112" class="txt small">アカウント</text><text x="22" y="144" class="txt small">プライバシー</text><rect x="12" y="156" width="158" height="30" rx="7" class="sel"/><text x="22" y="176" class="txt small">請求</text><text x="22" y="208" class="txt small">使用量</text><text x="22" y="240" class="txt small">機能</text>
  <text x="210" y="80" class="txt head">プロプラン</text><text x="210" y="112" class="muted small">Claude Codeを使うための有料プラン</text><text x="210" y="138" class="muted small">次回更新日を確認しておきます</text><rect x="835" y="78" width="95" height="30" rx="8" class="btn"/><text x="852" y="98" class="txt small">プラン調整</text>
  <text x="210" y="210" class="txt head">お支払い</text><rect x="210" y="250" width="18" height="18" rx="4" fill="#12b981"/><text x="240" y="265" class="txt small">Link by Stripe</text><rect x="875" y="238" width="55" height="30" rx="8" class="btn"/><text x="890" y="258" class="txt small">更新</text>
  <text x="210" y="335" class="txt head">請求書</text><text x="210" y="382" class="muted small">日付</text><text x="450" y="382" class="muted small">合計</text><text x="610" y="382" class="muted small">ステータス</text><text x="760" y="382" class="muted small">アクション</text>
  <line x1="210" y1="398" x2="930" y2="398" class="line"/><text x="210" y="430" class="txt small">2026年5月</text><text x="450" y="430" class="txt small">$22.00</text><text x="610" y="430" class="txt small">Paid</text><text x="760" y="430" class="txt small" fill="#2563eb">表示</text>
  <line x1="210" y1="450" x2="930" y2="450" class="line"/><text x="210" y="482" class="txt small">2026年4月</text><text x="450" y="482" class="txt small">$22.00</text><text x="610" y="482" class="txt small">Paid</text><text x="760" y="482" class="txt small" fill="#2563eb">表示</text>
  <text x="210" y="560" class="txt head">キャンセル</text><rect x="845" y="540" width="85" height="32" rx="8" class="danger"/><text x="866" y="562" fill="#fff" class="small" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif">キャンセル</text>
</svg>
