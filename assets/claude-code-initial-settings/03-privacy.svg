<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude設定 プライバシー</title>
  <desc id="desc">ロケーションメタデータ、改善協力、データのエクスポートを確認する画面の参考図</desc>
  <style>.bg{fill:#f7f7f5}.panel{fill:#fff}.sel{fill:#e8e6e2}.line{stroke:#e4e0da;stroke-width:1}.txt{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#171717}.muted{fill:#777}.small{font-size:14px}.head{font-size:22px;font-weight:800}.toggle{fill:#2563eb}.off{fill:#d6d3ce}.box{fill:#fff;stroke:#ddd}</style>
  <rect width="960" height="620" class="bg"/><rect width="960" height="34" class="panel"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="56" cy="17" r="6" fill="#28c840"/><text x="86" y="23" class="txt small">設定</text>
  <rect x="0" y="34" width="182" height="586" class="panel"/><text x="22" y="80" class="txt small">一般</text><text x="22" y="112" class="txt small">アカウント</text><rect x="12" y="124" width="158" height="30" rx="7" class="sel"/><text x="22" y="144" class="txt small">プライバシー</text><text x="22" y="176" class="txt small">請求</text><text x="22" y="208" class="txt small">使用量</text><text x="22" y="240" class="txt small">機能</text><text x="22" y="272" class="txt small">コネクタ</text><text x="22" y="304" class="txt small">Claude Code</text>
  <rect x="210" y="62" width="720" height="118" rx="12" class="box"/><text x="230" y="92" class="txt small">Anthropicは透明性のあるデータ取り扱いを重視しています。</text><line x1="230" y1="115" x2="910" y2="115" class="line"/><text x="230" y="148" class="txt small">お客様のデータを保護する方法</text>
  <text x="210" y="230" class="txt head">設定</text>
  <text x="210" y="278" class="txt small">ロケーションメタデータ</text><text x="210" y="304" class="muted small">大まかな位置情報を使用して体験を向上させます</text><rect x="900" y="274" width="34" height="18" rx="9" class="toggle"/><circle cx="923" cy="283" r="7" fill="#fff"/>
  <line x1="210" y1="326" x2="930" y2="326" class="line"/><text x="210" y="362" class="txt small">Claudeの改善にご協力ください</text><text x="210" y="388" class="muted small">チャットやコーディングセッションのデータ利用を許可します</text><rect x="900" y="358" width="34" height="18" rx="9" class="off"/><circle cx="911" cy="367" r="7" fill="#fff"/>
  <text x="210" y="450" class="txt head">あなたのデータ</text><text x="210" y="500" class="txt small">データのエクスポート</text><rect x="800" y="478" width="130" height="30" rx="8" class="box"/><text x="820" y="498" class="txt small">エクスポート</text><line x1="210" y1="522" x2="930" y2="522" class="line"/><text x="210" y="558" class="txt small">共有チャット</text><rect x="866" y="536" width="64" height="30" rx="8" class="box"/><text x="886" y="556" class="txt small">管理</text>
</svg>
