<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude Customize コネクタ</title>
  <desc id="desc">Customize画面でコネクタ一覧とツール権限を確認する参考図</desc>
  <style>.bg{fill:#f7f7f5}.panel{fill:#fff}.mid{fill:#fafafa}.sel{fill:#e8e6e2}.line{stroke:#e4e0da;stroke-width:1}.txt{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#171717}.muted{fill:#777}.small{font-size:14px}.head{font-size:22px;font-weight:800}.btn{fill:#fff;stroke:#ddd}.pill{fill:#eef2ff;stroke:#c7d2fe}.ok{fill:#e7f7ef}</style>
  <rect width="960" height="620" class="bg"/><rect width="960" height="34" class="panel"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="56" cy="17" r="6" fill="#28c840"/><text x="86" y="23" class="txt small">Customize</text>
  <rect x="0" y="34" width="190" height="586" class="panel"/>
  <rect x="12" y="58" width="166" height="32" rx="7" class="btn"/><text x="30" y="79" class="txt small">Desktop</text>
  <text x="24" y="128" class="txt small">スキル</text>
  <rect x="12" y="145" width="166" height="30" rx="7" class="sel"/><text x="24" y="165" class="txt small">コネクタ</text>
  <text x="24" y="225" class="muted small">個人用プラグイン</text><rect x="42" y="258" width="128" height="36" rx="8" class="btn"/><text x="64" y="281" class="txt small">プラグインを参照</text>
  <rect x="190" y="34" width="282" height="586" class="mid" stroke="#ddd"/>
  <text x="212" y="75" class="txt head">コネクタ</text>
  <text x="212" y="118" class="muted small">Web</text>
  <rect x="205" y="132" width="250" height="34" rx="8" class="sel"/><text x="248" y="154" class="txt small">Adobe for creativity</text>
  <text x="248" y="196" class="txt small">Canva</text>
  <text x="248" y="238" class="txt small">GitHub連携</text>
  <text x="248" y="280" class="txt small">Google Drive</text><rect x="395" y="262" width="42" height="22" rx="11" class="ok"/><text x="407" y="278" class="txt small">候補</text>
  <text x="248" y="322" class="txt small">Notion</text><rect x="395" y="304" width="42" height="22" rx="11" class="ok"/><text x="407" y="320" class="txt small">候補</text>
  <text x="248" y="364" class="txt small">Slack</text><rect x="395" y="346" width="42" height="22" rx="11" class="ok"/><text x="407" y="362" class="txt small">候補</text>
  <text x="212" y="430" class="muted small">デスクトップ</text>
  <text x="248" y="472" class="txt small">Claude in Chrome</text>
  <text x="510" y="78" class="txt head">コネクタのツール権限</text>
  <rect x="835" y="58" width="95" height="32" rx="8" class="btn"/><text x="855" y="79" class="txt small">切断する</text>
  <text x="510" y="122" class="muted small">必要な連携だけ接続し、ツールは承認が必要な状態で使います。</text>
  <text x="510" y="185" class="txt small">インタラクティブツール</text><rect x="820" y="164" width="110" height="32" rx="8" class="btn"/><text x="842" y="185" class="txt small">承認が必要</text>
  <line x1="510" y1="220" x2="930" y2="220" class="line"/>
  <text x="530" y="252" class="txt small">asset_search</text><circle cx="872" cy="247" r="13" class="pill"/><text x="867" y="252" class="txt small">✓</text><circle cx="910" cy="247" r="13" fill="#fff" stroke="#ddd"/>
  <line x1="510" y1="282" x2="930" y2="282" class="line"/>
  <text x="530" y="314" class="txt small">fill_text</text><circle cx="872" cy="309" r="13" class="pill"/><text x="867" y="314" class="txt small">✓</text><circle cx="910" cy="309" r="13" fill="#fff" stroke="#ddd"/>
  <line x1="510" y1="344" x2="930" y2="344" class="line"/>
  <text x="510" y="410" class="txt head">接続前に見るところ</text>
  <rect x="510" y="442" width="410" height="110" rx="12" fill="#fff" stroke="#ddd"/>
  <text x="535" y="478" class="txt small">1. 何のサービスに接続するか</text>
  <text x="535" y="508" class="txt small">2. どの操作をClaudeに許可するか</text>
  <text x="535" y="538" class="txt small">3. 承認が必要になっているか</text>
</svg>
