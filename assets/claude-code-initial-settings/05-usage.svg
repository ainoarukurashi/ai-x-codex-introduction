<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude設定 使用量</title>
  <desc id="desc">現在のセッション、週間制限、利用クレジットを確認する画面の参考図</desc>
  <style>.bg{fill:#f7f7f5}.panel{fill:#fff}.sel{fill:#e8e6e2}.line{stroke:#e4e0da;stroke-width:1}.txt{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#171717}.muted{fill:#777}.small{font-size:14px}.head{font-size:22px;font-weight:800}.bar{fill:#dedbd7}.blue{fill:#2563eb}.off{fill:#d6d3ce}</style>
  <rect width="960" height="620" class="bg"/><rect width="960" height="34" class="panel"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="56" cy="17" r="6" fill="#28c840"/><text x="86" y="23" class="txt small">設定</text>
  <rect x="0" y="34" width="182" height="586" class="panel"/><text x="22" y="80" class="txt small">一般</text><text x="22" y="112" class="txt small">アカウント</text><text x="22" y="144" class="txt small">プライバシー</text><text x="22" y="176" class="txt small">請求</text><rect x="12" y="188" width="158" height="30" rx="7" class="sel"/><text x="22" y="208" class="txt small">使用量</text><text x="22" y="240" class="txt small">機能</text>
  <text x="210" y="78" class="txt head">プラン使用制限</text><rect x="380" y="58" width="44" height="24" rx="12" fill="#e8e6e2"/><text x="394" y="75" class="txt small">Pro</text>
  <text x="210" y="128" class="txt small">現在のセッション</text><text x="210" y="154" class="muted small">メッセージが送信されると開始されます</text><rect x="520" y="126" width="340" height="6" rx="3" class="bar"/><rect x="520" y="126" width="20" height="6" rx="3" class="blue"/><text x="880" y="136" class="txt small">少し使用済み</text>
  <text x="210" y="235" class="txt head">週間制限</text><text x="210" y="285" class="txt small">すべてのモデル</text><text x="210" y="311" class="muted small">日曜日にリセット</text><rect x="520" y="285" width="340" height="6" rx="3" class="bar"/><rect x="520" y="285" width="26" height="6" rx="3" class="blue"/><text x="880" y="295" class="txt small">2%</text>
  <text x="210" y="356" class="txt small">Sonnetのみ</text><text x="210" y="382" class="muted small">日曜日にリセット</text><rect x="520" y="356" width="340" height="6" rx="3" class="bar"/><rect x="520" y="356" width="10" height="6" rx="3" class="blue"/><text x="880" y="366" class="txt small">0%</text>
  <text x="210" y="470" class="txt head">利用クレジット</text><text x="210" y="518" class="txt small">上限に達しても使い続けるための追加クレジット</text><rect x="900" y="508" width="34" height="18" rx="9" class="off"/><circle cx="911" cy="517" r="7" fill="#fff"/>
  <line x1="210" y1="542" x2="930" y2="542" class="line"/><text x="210" y="578" class="txt small">$0.00 使用</text><rect x="500" y="575" width="360" height="6" rx="3" class="bar"/>
</svg>
