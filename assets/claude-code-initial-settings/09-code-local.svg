<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code ローカルセッション</title>
  <desc id="desc">バイパス権限、リモートコントロール、ワークツリー、プレビューを確認するClaude Code設定画面の参考図</desc>
  <style>.bg{fill:#f7f7f5}.panel{fill:#fff}.sel{fill:#e8e6e2}.line{stroke:#e4e0da;stroke-width:1}.txt{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#171717}.muted{fill:#777}.small{font-size:14px}.head{font-size:22px;font-weight:800}.toggle{fill:#2563eb}.off{fill:#d6d3ce}.btn{fill:#fff;stroke:#ddd}</style>
  <rect width="960" height="620" class="bg"/><rect width="960" height="34" class="panel"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="56" cy="17" r="6" fill="#28c840"/><text x="86" y="23" class="txt small">設定</text>
  <rect x="0" y="34" width="182" height="586" class="panel"/><text x="22" y="80" class="txt small">一般</text><text x="22" y="112" class="txt small">アカウント</text><text x="22" y="144" class="txt small">プライバシー</text><text x="22" y="176" class="txt small">請求</text><text x="22" y="208" class="txt small">使用量</text><text x="22" y="240" class="txt small">機能</text><text x="22" y="272" class="txt small">コネクタ</text><rect x="12" y="284" width="158" height="30" rx="7" class="sel"/><text x="22" y="304" class="txt small">Claude Code</text>
  <text x="210" y="78" class="txt head">ローカルセッション</text>
  <text x="210" y="126" class="txt small">バイパス権限モードを許可</text><text x="210" y="152" class="muted small">すべての権限チェックをバイパスします</text><rect x="900" y="124" width="34" height="18" rx="9" class="off"/><circle cx="911" cy="133" r="7" fill="#fff"/>
  <line x1="210" y1="178" x2="930" y2="178" class="line"/><text x="210" y="214" class="txt small">デフォルトでリモートコントロールを有効にする</text><text x="210" y="240" class="muted small">新しいローカルセッションを自動的に接続します</text><rect x="900" y="212" width="34" height="18" rx="9" class="off"/><circle cx="911" cy="221" r="7" fill="#fff"/>
  <line x1="210" y1="266" x2="930" y2="266" class="line"/><text x="210" y="302" class="txt small">通知を目立たせる</text><text x="210" y="328" class="muted small">注意が必要な時にDockやタスクバーで知らせます</text><rect x="900" y="300" width="34" height="18" rx="9" class="toggle"/><circle cx="923" cy="309" r="7" fill="#fff"/>
  <line x1="210" y1="354" x2="930" y2="354" class="line"/><text x="210" y="390" class="txt small">ワークツリーの場所</text><rect x="760" y="368" width="170" height="32" rx="8" class="btn"/><text x="778" y="389" class="txt small">Inside project</text>
  <line x1="210" y1="420" x2="930" y2="420" class="line"/><text x="210" y="456" class="txt small">ブランチプレフィックス</text><rect x="760" y="434" width="170" height="32" rx="8" class="btn"/><text x="778" y="455" class="txt small">claude</text>
  <line x1="210" y1="486" x2="930" y2="486" class="line"/><text x="210" y="522" class="txt small">プレビュー</text><text x="210" y="548" class="muted small">開発サーバーとライブプレビューを使います</text><rect x="900" y="520" width="34" height="18" rx="9" class="toggle"/><circle cx="923" cy="529" r="7" fill="#fff"/>
</svg>
